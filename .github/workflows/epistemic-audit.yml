name: Epistemic Substrate Lab CI Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  edge-blob-guard:
    name: Stage 0 - Edge SOP Blob Size Guard (< 1MB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce < 1MB file limit
        run: |
          OVERSIZED=$(find . -not -path './.git/*' -type f -size +1M)
          if [ -n "$OVERSIZED" ]; then
            echo "ERROR: Oversized files violate Edge SOP (>1MB):"
            echo "$OVERSIZED"
            exit 1
          fi

  lean4-proof-gate:
    name: Stage 1 - Lean 4 Zero-Sorry Proof Gate
    needs: edge-blob-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan toolchain via lean-action
        uses: leanprover/lean-action@v1
        continue-on-error: true
        with:
          lake-package-directory: lean
          test: false
          lint: false
      - name: Resolve Mathlib manifest, fetch cache & build proofs
        working-directory: lean
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get
          lake build
      - name: Verify zero sorry/admit
        working-directory: lean
        run: |
          if grep -rnE '\b(sorry|admit)\b' *.lean; then
            echo "ERROR: Found sorry/admit in Lean proofs."
            exit 1
          fi

  julia-and-python-experiments:
    name: Stage 2 - Julia Static Geometry & Python Experiments A & B
    needs: lean4-proof-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install numpy
      - name: Install Julia StaticArrays & verify 0-byte allocation
        run: |
          julia -e 'using Pkg; Pkg.add("StaticArrays"); Pkg.precompile()'
          julia julia/ManifoldInstruments.jl
      - name: Run Experiment A (Metric & Kernel Audit) & Experiment B (Sheaf Gluing)
        run: |
          python3 experiments/exp1_metric_audit.py > telemetry_exp1.json
          python3 experiments/exp2_sheaf_gluing.py > telemetry_exp2.json
          cat telemetry_exp1.json
          cat telemetry_exp2.json
      - name: Archive Telemetry as Immutable CI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: epistemic-telemetry-${{ github.sha }}
          path: |
            telemetry_exp1.json
            telemetry_exp2.json
          retention-days: 90
